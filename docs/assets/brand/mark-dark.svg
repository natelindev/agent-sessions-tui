  <circle cx="18" cy="26" r="1.1" fill="#A79CFF" fill-opacity="0.4"/>
  <!-- Luminous prompt >_ -->
  <path d="M12 31.5L16.5 34.5L12 37.5" stroke="#A79CFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20.5" y1="37.5" x2="27" y2="37.5" stroke="#A79CFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bottom inactive terminal window -->
  <rect x="7" y="45" width="50" height="13" rx="4" stroke="#8B93A7" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="7" y1="49.5" x2="57" y2="49.5" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>
  <circle cx="12" cy="47.5" r="1.1" fill="#8B93A7" fill-opacity="0.5"/>
  <circle cx="15.5" cy="47.5" r="1.1" fill="#8B93A7" fill-opacity="0.5"/>
  <circle cx="19" cy="47.5" r="1.1" fill="#8B93A7" fill-opacity="0.5"/>
</svg>