  <circle cx="18" cy="26" r="1.1" fill="#FFFFFF" fill-opacity="0.35"/>
  <!-- Centered prompt >_ -->
  <path d="M12 31.5L16.5 34.5L12 37.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20.5" y1="37.5" x2="27" y2="37.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bottom inactive terminal window -->
  <rect x="7" y="45" width="50" height="13" rx="4" stroke="#5B4FDB" stroke-opacity="0.32" stroke-width="2"/>
  <line x1="7" y1="49.5" x2="57" y2="49.5" stroke="#5B4FDB" stroke-opacity="0.2" stroke-width="1.2"/>
  <circle cx="12" cy="47.5" r="1.1" fill="#5B4FDB" fill-opacity="0.45"/>
  <circle cx="15.5" cy="47.5" r="1.1" fill="#5B4FDB" fill-opacity="0.45"/>
  <circle cx="19" cy="47.5" r="1.1" fill="#5B4FDB" fill-opacity="0.45"/>
