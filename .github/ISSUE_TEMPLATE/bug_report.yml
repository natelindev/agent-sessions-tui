name: Bug report
description: Report a reproducible bug
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide as much detail as possible.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Clear, numbered steps
      placeholder: |
        1. Run ...
        2. Navigate ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 14.5 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: 1.24.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redacted logs; remove private paths, transcripts, keys, and hostnames
      render: shell
