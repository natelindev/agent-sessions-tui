name: Deploy documentation to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-docs
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Upload documentation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets; see CONTRIBUTING.md.' >&2
            exit 1
          fi
          npx --yes wrangler@4.148.0 pages deploy docs --project-name agent-sessions-tui --branch main
